
# =========================================================
# APPLICATION
# =========================================================

spring.application.name=hireflow-backend

server.port=${PORT:8080}


# =========================================================
# DATABASE - SUPABASE POSTGRESQL
# =========================================================

spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.hjsujcndlkhgsngqdkqu
spring.datasource.password=HIREFLOW2695

spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate automatically detects PostgreSQLDialect
spring.jpa.open-in-view=false


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=5

spring.datasource.hikari.minimum-idle=1

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=60000

spring.datasource.hikari.max-lifetime=300000

spring.datasource.hikari.keepalive-time=60000


# =========================================================
# JWT CONFIGURATION
# =========================================================

jwt.secret=${JWT_SECRET}

# 24 Hours
jwt.expiration=86400000


# =========================================================
# SPRING SECURITY LOGGING
# =========================================================

logging.level.org.springframework.security=DEBUG


# =========================================================
# SUPABASE STORAGE
# =========================================================

supabase.url=${SUPABASE_URL}

supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}


# =========================================================
# FRONTEND CONFIGURATION
# =========================================================

# Local React frontend by default.
# Later, when deployed, set FRONTEND_URL in Railway.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}


# =========================================================
# PASSWORD RESET CONFIGURATION
# =========================================================

# Password reset token validity in minutes
app.password-reset.expiration-minutes=30


# =========================================================
# EMAIL - GMAIL SMTP
# =========================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}

spring.mail.password=${MAIL_APP_PASSWORD}


# =========================================================
# SMTP AUTHENTICATION
# =========================================================

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true


# =========================================================
# MAIL ENCODING
# =========================================================

spring.mail.default-encoding=UTF-8


# =========================================================
# MAIL TIMEOUTS
# =========================================================

spring.mail.properties.mail.smtp.connectiontimeout=10000

spring.mail.properties.mail.smtp.timeout=10000

spring.mail.properties.mail.smtp.writetimeout=10000